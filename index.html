<head>

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f1c" media="(prefers-color-scheme: dark)">

<title>小熊168斷食</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@700;800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: 一欄式手機畫面。上方是小熊倒數圓環，下方依序是記錄吃飯、斷食時間、這一週。寬螢幕改成左右兩欄，圓環固定在左側。 */
:root {
  --bg: #f4f6f1;
  --surface: #ffffff;
  --surface-2: #eef2ea;
  --ink: #2d2a26;
  --ink-2: #6b665e;
  --line: #e1e6db;
  --track: #e4e8de;
  --honey: #f0b13e;
  --honey-ink: #3b2a1e;
  --honey-soft: #fbebc8;
  --honey-text: #6b4a0e;
  --leaf: #5daa7c;
  --leaf-soft: #ddf0e3;
  --leaf-text: #24573a;
  --warn: #b8432f;
  --warn-soft: #fbe3de;
  --bear-line: #6b4030;
  --face: #fff7ec;
  --ear-pink: #f8c9c3;
  --nose: #4a2e24;
  --blush: #f4a9a0;
  --mouth: #c4575a;
  --f-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "Nunito", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1f1c;
    --surface: #252a26;
    --surface-2: #2e342f;
    --ink: #f1eee8;
    --ink-2: #b3aea4;
    --line: #3a413b;
    --track: #353c36;
    --honey: #f2bb55;
    --honey-ink: #2a1d12;
    --honey-soft: #43361b;
    --honey-text: #f4d58e;
    --leaf: #6dbb8c;
    --leaf-soft: #24392c;
    --leaf-text: #a9ddbb;
    --warn: #f19a8b;
    --warn-soft: #4a2a25;
    --bear-line: #8a5640;
    --face: #f6e6d0;
    --ear-pink: #f0b4ad;
    --nose: #4a2e24;
    --blush: #eb9b92;
    --mouth: #c4575a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1f1c;
  --surface: #252a26;
  --surface-2: #2e342f;
  --ink: #f1eee8;
  --ink-2: #b3aea4;
  --line: #3a413b;
  --track: #353c36;
  --honey: #f2bb55;
  --honey-ink: #2a1d12;
  --honey-soft: #43361b;
  --honey-text: #f4d58e;
  --leaf: #6dbb8c;
  --leaf-soft: #24392c;
  --leaf-text: #a9ddbb;
  --warn: #f19a8b;
  --warn-soft: #4a2a25;
  --bear-line: #8a5640;
  --face: #f6e6d0;
  --ear-pink: #f0b4ad;
  --nose: #4a2e24;
  --blush: #eb9b92;
  --mouth: #c4575a;
  color-scheme: dark;
}

html { background: var(--bg); }
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 940px; margin: 0 auto; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mb { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 2px solid transparent; }
.mb img { width: 76%; height: auto; display: block; }
.mb.kept { background: var(--face); }
.mb.broken { background: var(--warn-soft); border-color: var(--warn); }
.mb.none { border: 2px dashed var(--track); }
.mb.none img { opacity: 0.25; }
.brand span { font-family: var(--f-display); font-size: 21px; line-height: 1.2; }
.today { color: var(--ink-2); font-size: 14px; white-space: nowrap; }

.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.stack { display: grid; gap: 16px; min-width: 0; }
@media (min-width: 840px) {
  .layout { grid-template-columns: minmax(0, 380px) minmax(0, 1fr); align-items: start; }
  .hero { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
}

.hero {
  --ring: var(--honey);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 28px;
  padding: 20px 20px 24px;
  text-align: center;
  min-width: 0;
}
.hero[data-state="eat"] { --ring: var(--leaf); }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 14px; border-radius: 999px;
  font-weight: 700; font-size: 14px;
  background: var(--honey-soft); color: var(--honey-text);
}
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--honey); }
.hero[data-state="eat"] .pill { background: var(--leaf-soft); color: var(--leaf-text); }
.hero[data-state="eat"] .pill::before { background: var(--leaf); }

.ring-wrap { width: min(100%, 290px); margin: 14px auto 6px; }
.ring-wrap svg { display: block; width: 100%; height: auto; }
.track { fill: none; stroke: var(--track); stroke-width: 14; }
.prog { fill: none; stroke: var(--ring); stroke-width: 14; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 130px 130px; }

/* 小熊：依照你畫的草圖描成向量，線條加粗、轉角圓潤 */
.b-line { stroke: var(--bear-line); stroke-width: 4.6; stroke-linejoin: round; stroke-linecap: round; }
.b-fill { fill: var(--face); }
.b-pink { fill: var(--ear-pink); stroke: var(--bear-line); stroke-width: 3.8; stroke-linejoin: round; }
.ink { fill: var(--nose); }
.hl { fill: #fff; }
.cheek { fill: var(--blush); opacity: 0.6; }
.mouth-line { fill: none; stroke: var(--nose); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.mouth-open { fill: var(--mouth); stroke: var(--nose); stroke-width: 3; stroke-linejoin: round; }
.cookie { fill: #eab66e; stroke: var(--bear-line); stroke-width: 3.6; }
.cookie-chip { fill: #7a4b2a; }
.hero[data-state="fast"] .e-only, .hero[data-state="eat"] .f-only { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .bear { transform-box: fill-box; transform-origin: center; animation: breathe 4.5s ease-in-out infinite; }
}
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }

.count-label { margin: 0; color: var(--ink-2); font-size: 14px; }
.count { margin: 2px 0 6px; font-family: var(--f-num); font-weight: 800; font-size: 46px; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.sub { margin: 0; color: var(--ink-2); font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 19px; line-height: 1.3; text-wrap: balance; }

.field-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.field-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--ink-2); }
input[type="time"] {
  display: block; width: 100%; min-width: 0; max-width: 100%; min-height: 46px;
  -webkit-appearance: none; appearance: none;
  font-family: var(--f-num); font-weight: 700; font-size: 18px; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 9px 12px; text-align: left;
}
input[type="time"]::-webkit-date-and-time-value { text-align: left; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 14px; color: var(--ink); cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; min-height: 36px; white-space: nowrap;
}
.chip.now { min-height: 46px; padding-inline: 16px; }
.chip[aria-pressed="true"] { background: var(--honey-soft); border-color: var(--honey); color: var(--honey-text); font-weight: 700; }
.btn {
  font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 14px;
  background: var(--honey); color: var(--honey-ink); padding: 12px 20px; min-height: 48px;
}
.btn.block { width: 100%; }
.btn:active { transform: translateY(1px); }
.chip:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, input:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }

.stack-form { display: grid; gap: 14px; }
.status { display: grid; gap: 2px; min-height: 1.3em; }
.hint { margin: 0; font-size: 13px; color: var(--warn); }
.toast { margin: 0; font-size: 13px; color: var(--leaf-text); }

.meals { list-style: none; margin: 14px 0 0; padding: 0; }
.meal { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.m-name { font-weight: 700; }
.m-time { font-family: var(--f-num); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.badge { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.good { background: var(--leaf-soft); color: var(--leaf-text); }
.icon-btn { margin-left: auto; width: 40px; height: 40px; flex: none; display: grid; place-items: center; background: transparent; border: 0; border-radius: 12px; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.empty { margin: 14px 0 0; color: var(--ink-2); font-size: 14px; }

.fast-summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 0; font-size: 14px; color: var(--ink-2); }
.presets { margin-top: 14px; display: grid; gap: 8px; }
.presets .lbl { font-size: 13px; color: var(--ink-2); }
.err { margin: 8px 0 0; font-size: 13px; color: var(--warn); }
.err:empty { margin: 0; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { display: grid; justify-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 14px; border: 1px solid transparent; }
.day.today { border-color: var(--honey); background: var(--honey-soft); }
.day .wd { font-size: 12px; color: var(--ink-2); }
.day.today .wd { color: var(--honey-text); }
.day .cnt { font-family: var(--f-num); font-weight: 700; font-size: 12px; color: var(--ink-2); min-height: 1.2em; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0 0; font-size: 13px; color: var(--ink-2); }

.note { margin: 20px 4px 0; font-size: 13px; color: var(--ink-2); }
</style>
</head>

    <div class="brand">
      <span class="mb kept"><img id="brandBear" alt="" width="36" height="29"></span>

  function $(id) { return document.getElementById(id); }
  function p2(n) { return String(n).padStart(2, '0'); }
  function toMin(s) { var a = s.split(':'); return Number(a[0]) * 60 + Number(a[1]); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function normalize(d) {
    var ok = function (s) { return typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s); };
    var out = { v: 1, fastStart: '20:00', fastEnd: '12:00', meals: [] };
    if (d && typeof d === 'object') {
      if (ok(d.fastStart) && ok(d.fastEnd) && d.fastStart !== d.fastEnd) { out.fastStart = d.fastStart; out.fastEnd = d.fastEnd; }
      if (Array.isArray(d.meals)) {
        var cut = Date.now() - 60 * 864e5, seen = {};
        d.meals.forEach(function (m) {
          if (m && typeof m.t === 'number' && isFinite(m.t) && m.t > cut && typeof m.id === 'string' && !seen[m.id]) {
            seen[m.id] = 1;
            out.meals.push({ id: m.id, t: m.t, label: typeof m.label === 'string' ? m.label.slice(0, 8) : '' });
          }
        });
        out.meals.sort(function (a, b) { return a.t - b.t; });
      }
    }
    return out;
  }

  var state;
  try { state = normalize(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { state = normalize(null); }

  /* ---------- 儲存 ---------- */
  var dbRef = null, lastSaved = '', saveTimer = null, saving = false, again = false, dirty = false;
  var NOTES = {
    local: '記錄存在這個瀏覽器裡，清除網站資料時會一起消失。',
    db: '記錄只有你看得到，換裝置登入也會同步。',
    fail: '暫時無法同步，記錄先存在這個瀏覽器裡。',
    slow: '還連不上雲端，先用這個瀏覽器裡的記錄。'
  };
  function setNote(k) { $('note').textContent = NOTES[k]; }
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function persist() {
    saveLocal();
    if (dbRef) { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500); }
  }
  function flush() {
    if (!dbRef) return;
    if (saving) { again = true; return; }
    var j = JSON.stringify(state);
    if (j === lastSaved) { dirty = false; return; }
    saving = true;
    dbRef.set(JSON.parse(j)).then(function () { lastSaved = j; setNote('db'); }, function () { setNote('fail'); }).then(function () {
      saving = false;
      if (again) { again = false; flush(); } else { dirty = false; }
    });
  }

  /* ---------- 時間計算 ---------- */
  function fastDurSec() { return ((toMin(state.fastEnd) - toMin(state.fastStart) + 1440) % 1440) * 60; }
  function inFast(ts) {
    var d = new Date(ts), min = d.getHours() * 60 + d.getMinutes();
    var S = toMin(state.fastStart), dur = fastDurSec() / 60;
    return ((min - S + 1440) % 1440) < dur;
  }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function hm(sec) { return p2(Math.floor(sec / 3600)) + ':' + p2(Math.floor(sec % 3600 / 60)) + ':' + p2(sec % 60); }
  function hmText(sec) { var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h + ' 小時' + (m ? ' ' + m + ' 分' : ''); }

  function tick() {
    var now = new Date();
    var sec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    var S = toMin(state.fastStart) * 60, E = toMin(state.fastEnd) * 60;
    var fd = fastDurSec(), into = (sec - S + 86400) % 86400;
    var fasting = into < fd, elapsed, total;
    if (fasting) { elapsed = into; total = fd; }
    else { elapsed = (sec - E + 86400) % 86400; total = 86400 - fd; }
    var remain = Math.max(0, total - elapsed);
    var hero = $('hero');
    hero.dataset.state = fasting ? 'fast' : 'eat';
    $('pill').textContent = fasting ? '斷食中' : '進食時間';
    $('countLabel').textContent = fasting ? '距離開始進食還有' : '距離開始斷食還有';
    $('count').textContent = hm(remain);
    $('sub').textContent = fasting
      ? state.fastEnd + ' 開始進食，已斷食 ' + hmText(elapsed)
      : state.fastStart + ' 開始斷食，已進食 ' + hmText(elapsed);
    $('prog').setAttribute('stroke-dashoffset', String(RING * (1 - Math.min(1, elapsed / total))));
    $('ringLabel').setAttribute('aria-label', (fasting ? '斷食中，' : '進食時間，') + '進度 ' + Math.round(elapsed / total * 100) + '%');
    var dm = now.getHours() * 60 + now.getMinutes();
    if (dm !== lastMin) { lastMin = dm; syncMealForm(); renderHeaderDate(); }
  }
  var lastMin = -1;

  function renderHeaderDate() {
    var d = new Date();
    $('today').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 週' + WD[d.getDay()];
  }

  /* ---------- 記錄吃飯 ---------- */
  var mealTouched = false, labelTouched = false, selLabel = '';
  function suggest(h) { return h < 10 ? '早餐' : h < 14 ? '午餐' : h < 17 ? '點心' : h < 21 ? '晚餐' : '點心'; }
  function nowHM() { var d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function syncMealForm() {
    if (!mealTouched) $('mealTime').value = nowHM();
    var v = $('mealTime').value;
    if (!labelTouched && /^\d\d:\d\d$/.test(v)) selLabel = suggest(Number(v.slice(0, 2)));
    paintChips();
    updateHint();
  }
  function paintChips() {
    Array.prototype.forEach.call($('labelChips').children, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-l') === selLabel ? 'true' : 'false');
    });
  }
  function updateHint() {
    var v = $('mealTime').value, h = '';
    if (/^\d\d:\d\d$/.test(v)) {
      var min = toMin(v), S = toMin(state.fastStart), dur = fastDurSec() / 60;
      if (((min - S + 1440) % 1440) < dur) h = '這個時間還在斷食中，會記成提早開吃。';
    }
    $('fastHint').textContent = h;
  }
  var toastTimer = null;
  function toast(msg) {
    $('toast').textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').textContent = ''; }, 3500);
  }
  $('mealTime').addEventListener('input', function () { mealTouched = true; syncMealForm(); });
  $('nowBtn').addEventListener('click', function () { mealTouched = false; labelTouched = false; syncMealForm(); });
  $('labelChips').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-l]');
    if (!b) return;
    selLabel = b.getAttribute('data-l'); labelTouched = true; paintChips();
  });
  $('addMeal').addEventListener('click', function () {
    var v = $('mealTime').value;
    if (!/^\d\d:\d\d$/.test(v)) { toast('請先選好吃飯的時間。'); return; }
    var d = new Date();
    d.setHours(Number(v.slice(0, 2)), Number(v.slice(3, 5)), 0, 0);
    var label = selLabel || '吃飯';
    state.meals.push({ id: uid(), t: d.getTime(), label: label });
    state.meals.sort(function (a, b) { return a.t - b.t; });
    changed();
    toast('已記下 ' + v + ' ' + label + '。');
    mealTouched = false; labelTouched = false; syncMealForm();
  });

  function renderMeals() {
    var ul = $('mealList'); ul.textContent = '';
    var tk = dayKey(Date.now());
    var list = state.meals.filter(function (m) { return dayKey(m.t) === tk; });
    $('mealEmpty').hidden = list.length > 0;
    list.forEach(function (m) {
      var li = document.createElement('li'); li.className = 'meal';
      var name = document.createElement('span'); name.className = 'm-name'; name.textContent = m.label || '吃飯';
      var d = new Date(m.t);
      var tm = document.createElement('span'); tm.className = 'm-time'; tm.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes());
      li.appendChild(name); li.appendChild(tm);
      if (inFast(m.t)) {
        var b = document.createElement('span'); b.className = 'badge warn'; b.textContent = '斷食中吃的';
        li.appendChild(b);
      }
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'icon-btn';
      del.setAttribute('aria-label', '刪除 ' + tm.textContent + ' ' + (m.label || '吃飯') + ' 的記錄');
      del.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
      del.addEventListener('click', function () {
        state.meals = state.meals.filter(function (x) { return x.id !== m.id; });
        changed();
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
  }

  /* ---------- 斷食時間設定 ---------- */
  var PRESETS = [['10:00', '18:00'], ['12:00', '20:00'], ['14:00', '22:00']];
  function renderSettings() {
    $('fastStart').value = state.fastStart;
    $('fastEnd').value = state.fastEnd;
    var fd = fastDurSec(), ed = 86400 - fd;
    $('summary').textContent = '每天斷食 ' + hmText(fd) + '，進食 ' + hmText(ed);
    var whole = fd % 3600 === 0;
    var r = $('ratio');
    r.textContent = whole ? (fd / 3600) + ':' + (ed / 3600) : '自訂';
    r.className = 'badge ' + (fd === 57600 ? 'good' : '');
    var box = $('presets'); box.textContent = '';
    PRESETS.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.textContent = p[0] + '–' + p[1];
      b.setAttribute('aria-pressed', (state.fastStart === p[1] && state.fastEnd === p[0]) ? 'true' : 'false');
      b.addEventListener('click', function () {
        state.fastStart = p[1]; state.fastEnd = p[0];
        $('setErr').textContent = '';
        changed();
      });
      box.appendChild(b);
    });
  }
  function onTimeSetting(key) {
    return function () {
      var el = $(key), v = el.value;
      var other = key === 'fastStart' ? state.fastEnd : state.fastStart;
      if (!/^\d\d:\d\d$/.test(v)) { el.value = state[key]; return; }
      if (v === other) {
        $('setErr').textContent = '開始和結束不能是同一個時間。';
        el.value = state[key];
        return;
      }
      $('setErr').textContent = '';
      state[key] = v;
      changed();
    };
  }
  $('fastStart').addEventListener('change', onTimeSetting('fastStart'));
  $('fastEnd').addEventListener('change', onTimeSetting('fastEnd'));

  /* ---------- 這一週 ---------- */
  function dayStatus(list) { return !list.length ? 'none' : list.some(function (m) { return inFast(m.t); }) ? 'broken' : 'kept'; }
  function miniBear(kind) {
    return '<span class="mb ' + kind + '"><img src="' + BEAR + '" alt="" width="36" height="29"></span>';
  }
  function renderWeek() {
    var byDay = {};
    state.meals.forEach(function (m) { (byDay[dayKey(m.t)] = byDay[dayKey(m.t)] || []).push(m); });
    var wk = $('week'); wk.textContent = '';
    var base = new Date(); base.setHours(12, 0, 0, 0);
    for (var i = 6; i >= 0; i--) {
      var d = new Date(base.getTime() - i * 864e5);
      var list = byDay[dayKey(d.getTime())] || [];
      var st = dayStatus(list);
      var cell = document.createElement('div');
      cell.className = 'day' + (i === 0 ? ' today' : '');
      var label = (d.getMonth() + 1) + '月' + d.getDate() + '日，' + (st === 'none' ? '沒有記錄' : st === 'kept' ? '都在進食時間吃' : '有在斷食時間吃') + '，' + list.length + ' 餐';
      cell.setAttribute('role', 'img'); cell.setAttribute('aria-label', label);
      cell.innerHTML = '<span class="wd">' + (i === 0 ? '今天' : '週' + WD[d.getDay()]) + '</span>' + miniBear(st) + '<span class="cnt">' + (list.length || '') + '</span>';
      wk.appendChild(cell);
    }
    var n = 0;
    for (var k = 0; k < 60; k++) {
      var dd = new Date(base.getTime() - k * 864e5);
      var l2 = byDay[dayKey(dd.getTime())] || [];
      var s2 = dayStatus(l2);
      if (k === 0 && s2 === 'none') continue;
      if (s2 === 'kept') n++; else break;
    }
    $('streak').textContent = n > 0 ? '連續守住 ' + n + ' 天' : '從今天開始累積';
  }

  function changed() { persist(); renderAll(); }
  function renderAll() { renderMeals(); renderSettings(); renderWeek(); updateHint(); tick(); }

  renderHeaderDate();
  setNote('local');
  syncMealForm();
  renderAll();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { lastMin = -1; renderAll(); } });

  /* ---------- 雲端同步（登入的人才有；沒有就維持瀏覽器儲存） ---------- */
  (function initDb() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) { return id ? { db: db, id: id } : null; });
    }).then(function (ctx) {
      if (!ctx) return;
      var ref = ctx.db.doc('data/users/' + ctx.id + '/fasting');
      var first = true;
      var timer = setTimeout(function () { if (first) setNote('slow'); }, 10000);
      ref.onSnapshot(function (snap) {
        if (snap.metadata && snap.metadata.fromCache) return;
        clearTimeout(timer);
        dbRef = ref;
        if (dirty || saving) return;
        if (snap.exists) {
          var remote = normalize(snap.data());
          lastSaved = JSON.stringify(remote);
          if (first) {
            var have = {};
            remote.meals.forEach(function (m) { have[m.id] = 1; });
            state.meals.forEach(function (m) { if (!have[m.id]) remote.meals.push(m); });
            remote.meals.sort(function (a, b) { return a.t - b.t; });
          }
          if (JSON.stringify(remote) !== JSON.stringify(state)) { state = remote; saveLocal(); renderAll(); }
        } else {
          lastSaved = '';
        }
        first = false;
        setNote('db');
        if (JSON.stringify(state) !== lastSaved) { dirty = true; flush(); }
      }, function () { setNote('fail'); });
    }).catch(function () {});
  })();
})();
</script>
<script>if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) { navigator.serviceWorker.register("sw.js").catch(function () {}); }</script>
